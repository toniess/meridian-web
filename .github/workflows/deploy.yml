# Сборка образа и публикация в Artifact Registry Cloud.ru.
# Container App настроен на тег latest и разворачивает новую ревизию сам,
# как только в реестр приходит образ.
name: build & push

on:
  push:
    branches: [main]
  workflow_dispatch:

# Два прогона подряд не должны чистить реестр одновременно:
# второй мог бы удалить образ, который только что залил первый
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    # зависшая отправка роняет прогон, а не висит до лимита в 6 часов
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Проверка настроек репозитория
        env:
          REGISTRY: ${{ vars.CLOUDRU_REGISTRY }}
          IMAGE: ${{ vars.IMAGE_NAME }}
          KEY_ID: ${{ secrets.CLOUDRU_KEY_ID }}
          KEY_SECRET: ${{ secrets.CLOUDRU_KEY_SECRET }}
        run: |
          miss=""
          [ -n "$REGISTRY" ]   || miss="$miss vars.CLOUDRU_REGISTRY"
          [ -n "$IMAGE" ]      || miss="$miss vars.IMAGE_NAME"
          [ -n "$KEY_ID" ]     || miss="$miss secrets.CLOUDRU_KEY_ID"
          [ -n "$KEY_SECRET" ] || miss="$miss secrets.CLOUDRU_KEY_SECRET"
          if [ -n "$miss" ]; then
            echo "::error::Не заданы:$miss — см. раздел «Автодеплой» в README"
            exit 1
          fi

      # linux/amd64 обязателен: Container Apps не запустит arm-образ
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: imjasonh/setup-crane@v0.4

      # С реестром работает только crane. Docker и buildkit берут токен
      # POST-запросом к id.cloud.ru, а тот с раннеров GitHub через раз
      # отвечает 502 — отправка зависала без единой строки в логе (до 2 ч).
      # crane берёт токен GET-запросом, у него этой проблемы нет.
      - name: Вход в реестр Cloud.ru
        env:
          KEY_ID: ${{ secrets.CLOUDRU_KEY_ID }}
          KEY_SECRET: ${{ secrets.CLOUDRU_KEY_SECRET }}
        run: echo "$KEY_SECRET" | crane auth login "${{ vars.CLOUDRU_REGISTRY }}" -u "$KEY_ID" --password-stdin

      # Образ под latest до публикации — это предыдущая версия,
      # её оставляем для отката. При первом запуске latest ещё нет.
      - name: Запомнить предыдущий образ
        id: prev
        run: |
          digest=$(crane digest "${{ vars.CLOUDRU_REGISTRY }}/${{ vars.IMAGE_NAME }}:latest" 2>/dev/null || true)
          echo "digest=$digest" >> $GITHUB_OUTPUT
          echo "Предыдущий образ: ${digest:-нет}"

      # Поэтому образ собирается в архив, а не сразу в реестр
      - name: Сборка
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          tags: ${{ vars.CLOUDRU_REGISTRY }}/${{ vars.IMAGE_NAME }}:sha-${{ github.sha }}
          outputs: type=docker,dest=/tmp/image.tar
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
            API_BASE=${{ vars.API_BASE }}
            MERIDIAN_PROJECT_SLUG=${{ vars.MERIDIAN_PROJECT_SLUG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # latest — то, за чем следит Container App, его ставим последним:
      # к этому моменту образ уже целиком в реестре.
      # sha-… остаётся в реестре, чтобы было на что откатиться.
      # Повтор докачивает только то, что не долетело в прошлый раз.
      - name: Публикация
        id: build
        env:
          IMAGE: ${{ vars.CLOUDRU_REGISTRY }}/${{ vars.IMAGE_NAME }}
          TAG: sha-${{ github.sha }}
        run: |
          for attempt in 1 2 3; do
            timeout 300 crane push /tmp/image.tar "$IMAGE:$TAG" && break
            [ "$attempt" = 3 ] && { echo "::error::Образ не отправился за 3 попытки"; exit 1; }
            echo "::warning::Попытка $attempt не удалась, повторяем"
          done
          crane tag "$IMAGE:$TAG" latest
          # digest из реестра, а не от сборщика: по нему очистка решает, что оставить
          echo "digest=$(crane digest "$IMAGE:$TAG")" >> $GITHUB_OUTPUT

      # В реестре остаются только текущий и предыдущий образ.
      # Удаляем по digest, поэтому вместе с образом уходят все его теги.
      # Ошибка очистки не валит деплой: образ к этому моменту уже опубликован.
      - name: Удаление старых образов
        continue-on-error: true
        env:
          REPO: ${{ vars.CLOUDRU_REGISTRY }}/${{ vars.IMAGE_NAME }}
          CURRENT: ${{ steps.build.outputs.digest }}
          PREVIOUS: ${{ steps.prev.outputs.digest }}
        run: |
          [ -n "$CURRENT" ] || { echo "::error::Не известен digest нового образа"; exit 1; }
          # реестр не ответил — это ошибка, а не «удалять нечего»
          tags=$(crane ls "$REPO") || { echo "::error::Реестр не отдал список тегов"; exit 1; }
          echo "Тегов в реестре: $(echo "$tags" | grep -c .)"
          stale=""
          for tag in $tags; do
            d=$(crane digest "$REPO:$tag")
            if [ "$d" = "$CURRENT" ] || [ "$d" = "$PREVIOUS" ]; then
              echo "Оставляем: $tag"
              continue
            fi
            echo "К удалению: $tag ($d)"
            stale="$stale $d"
          done
          stale=$(echo $stale | tr ' ' '\n' | sort -u | grep . || true)
          for d in $stale; do
            crane delete "$REPO@$d"
          done
          echo "Удалено образов: $(echo "$stale" | grep -c . || true)" | tee -a $GITHUB_STEP_SUMMARY

      - name: Итог
        run: echo "Опубликовано ${{ vars.CLOUDRU_REGISTRY }}/${{ vars.IMAGE_NAME }}:latest и :sha-${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
