# Сборка образа и публикация в Artifact Registry Cloud.ru.
# Container App настроен на тег latest и разворачивает новую ревизию сам,
# как только в реестр приходит образ.
name: build & push

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # linux/amd64 обязателен: Container Apps не запустит arm-образ
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Вход в реестр Cloud.ru
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.CLOUDRU_REGISTRY }}
          username: ${{ secrets.CLOUDRU_KEY_ID }}
          password: ${{ secrets.CLOUDRU_KEY_SECRET }}

      - name: Сборка и публикация
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          # latest — то, за чем следит Container App;
          # sha-… остаётся в реестре, чтобы было на что откатиться
          tags: |
            ${{ vars.CLOUDRU_REGISTRY }}/${{ vars.IMAGE_NAME }}:latest
            ${{ vars.CLOUDRU_REGISTRY }}/${{ vars.IMAGE_NAME }}:sha-${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Итог
        run: echo "Опубликовано ${{ vars.CLOUDRU_REGISTRY }}/${{ vars.IMAGE_NAME }}:latest и :sha-${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
